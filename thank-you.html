<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Dream Haven Construction</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF8F4; --ivory-dim:#F1ECE3; --ink:#23271F; --ink-mid:#3C4238; --ink-soft:#6B7165;
    --rule:#DCD5C7; --gold:#A98A4E; --gold-deep:#8A6E38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ivory);
    color:var(--ink-mid);font-family:'Jost',system-ui,sans-serif;font-weight:300;text-align:center;padding:40px 24px;
  }
  .box{max-width:520px;}
  .monogram{width:120px;margin:0 auto 32px;display:block;}
  .mark{font-family:'Cormorant Garamond',serif;font-size:3rem;color:var(--gold);margin-bottom:8px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:2.4rem;color:var(--ink);margin:0 0 18px;}
  p{font-size:1.02rem;color:var(--ink-soft);line-height:1.7;margin:0 0 32px;}
  a.btn{
    display:inline-block;border:1px solid var(--ink);color:var(--ink);text-decoration:none;
    font-size:11.5px;letter-spacing:0.2em;text-transform:uppercase;padding:16px 30px;transition:.2s;
  }
  a.btn:hover{background:var(--gold-deep);border-color:var(--gold-deep);color:var(--ivory);}
  .contact{margin-top:36px;font-size:.9rem;color:var(--ink-soft);}
  .contact a{color:var(--gold-deep);text-decoration:none;}
</style>
</head>
<body>
  <div class="box">
    <img class="monogram" src="images/logo-mark.png" alt="Dream Haven Construction">
    <div class="mark">”</div>
    <h1>Thank you.</h1>
    <p>Your request has been received. Ayman will personally follow up within one business day to confirm details and schedule a walkthrough.</p>
    <a class="btn" href="index.html">Back to Home</a>
    <p class="contact">Need to reach us sooner? Call <a href="tel:3108445101">(310) 844‑5101</a></p>
  </div>
</body>
</html>
